{% extends "base.html" %}
{% block title %}Page Not Found — SmartShop AI{% endblock %}

{% block content %}
<section class="section">
  <div class="container" style="text-align:center; padding: 64px 20px;">
    <span class="badge" style="margin-bottom:14px;">404 Error</span>
    <h1 style="font-size: 2.3rem; margin-bottom: 10px;">Page Not Found</h1>
    <p style="color: var(--slate-500); margin-bottom: 24px;">The page you requested does not exist or has moved.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">Return to Home</a>
  </div>
</section>
{% endblock %}
